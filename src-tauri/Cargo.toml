[package]
name = "no_pysop"
version = "0.1.0"
description = "Unified Social Media Aggregator — client-heavy, zero-server"
authors = ["yahya"]
edition = "2021"
default-run = "no_pysop"

[lib]
name = "no_pysop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["cookies", "json", "blocking"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
urlencoding = "2"
keyring = "2"
rand = "0.8"
dirs-next = "2"
tiny_http = "0.12"
feed-rs = "2.4"

[[bin]]
name = "sync_host"
path = "src/bin/sync_host.rs"
